[package]
name = "sideband"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arti-client = { version = "0.42", features = ["onion-service-service", "onion-service-client", "tokio", "native-tls"] }
base64 = "0.22"
bincode = "1.3"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "help"] }
crossterm = "0.28"
data-encoding = "2.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.39", features = ["bundled"] }
safelog = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.12"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tor-hsclient = "0.42"
tor-hsservice = "0.42"
tor-cell = "0.42"
tor-persist = "0.42"
tor-rtcompat = { version = "0.42", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }

[dev-dependencies]
tempfile = "3"
