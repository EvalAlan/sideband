name: sideband_gui
description: Sideband desktop/mobile GUI shell
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  file_selector: ^1.0.3
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  mobile_scanner: ^7.2.0
  image: ^4.9.1
  zxing2: ^0.2.4
  url_launcher: ^6.3.1

dependency_overrides:
  mobile_scanner:
    path: vendor/mobile_scanner

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon_512x512.png
    - assets/icon_256x256.png

  fonts:
    - family: SidebandEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
