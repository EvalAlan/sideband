# PARTIAL EXAMPLE ONLY: merge these keys into the config.yaml generated by
# `docker compose run --rm telegram`. Do not replace the generated file with this.
network:
  # Create an application at https://my.telegram.org/apps (required upstream).
  api_id: 123456
  api_hash: REPLACE_WITH_TELEGRAM_API_HASH

homeserver:
  address: http://synapse:8008
  domain: localhost # must equal MATRIX_SERVER_NAME

appservice:
  address: http://telegram:29317
  hostname: 0.0.0.0
  port: 29317

# A separate SQLite database is adequate for a small/local deployment.
database:
  type: sqlite3-fk-wal
  uri: file:/data/telegram.db?_txlock=immediate

bridge:
  permissions:
    "*": relay
    "localhost": user
    "@sideband:localhost": admin
