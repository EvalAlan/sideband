# PARTIAL EXAMPLE ONLY: merge these keys into the config.yaml generated by
# `docker compose run --rm discord`. Do not replace the generated file with this.
homeserver:
  address: http://synapse:8008
  domain: localhost # must equal MATRIX_SERVER_NAME

appservice:
  address: http://discord:29334
  hostname: 0.0.0.0
  port: 29334
  database:
    type: sqlite3-fk-wal
    uri: file:/data/discord.db?_txlock=immediate

bridge:
  permissions:
    "*": relay
    "localhost": user
    "@sideband:localhost": admin
