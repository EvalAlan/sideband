[package]
name = "sideband-matrix-connector"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "sideband-bridge-matrix"
path = "../../src/bin/sideband-bridge-matrix.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
matrix-sdk = { version = "0.18", features = ["bundled-sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sideband-bridge-provisioning = { path = "../provisioning" }
tokio = { version = "1", features = ["full"] }